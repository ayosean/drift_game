<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drift Game</title>
  <style>
    body {
      margin: 0;
      background: #111;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas {
      border: 3px solid #333;
      box-shadow: 0 0 24px rgba(0,0,0,0.8);
      cursor: pointer;
    }
    .info { margin-top: 10px; font-size: 13px; color: #aaa; }
    .hl { color: #6cf; font-weight: bold; }
    .audio-bar {
      display: flex; align-items: center; gap: 10px;
      margin-top: 8px; font-size: 13px; color: #888;
    }
    #muteBtn {
      background: #1a1a1a; border: 1px solid #444; color: #ccc;
      padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    #muteBtn:hover { border-color: #6cf; color: #fff; }
    #volSlider { width: 120px; accent-color: #6cf; cursor: pointer; }
    #volPct { min-width: 36px; }
    #nameOverlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.78); z-index: 99;
      align-items: center; justify-content: center;
    }
    #nameBox {
      background: #161624; border: 2px solid #ffe066;
      border-radius: 12px; padding: 32px 40px; text-align: center;
      box-shadow: 0 0 40px rgba(255,224,102,0.25);
    }
    #nameBox p { color: #ffe066; font-size: 18px; margin: 0 0 16px; }
    #nameInput {
      width: 220px; padding: 10px 14px; font-size: 17px;
      background: #0d0d1a; border: 1.5px solid #444; border-radius: 8px;
      color: #fff; outline: none; display: block; margin: 0 auto 14px;
    }
    #nameInput:focus { border-color: #ffe066; }
    .name-btn {
      padding: 9px 28px; border-radius: 8px; font-size: 15px;
      cursor: pointer; border: none; margin: 0 6px;
    }
    #nameSubmitBtn { background: #ffe066; color: #111; font-weight: bold; }
    #nameSkipBtn   { background: #222; color: #888; }
  </style>
</head>
<body>
  <audio id="bgm" src="eurobeat.mp3" loop></audio>
  <canvas id="gameCanvas" width="800" height="520"></canvas>
  <div class="info">
    <span class="hl">WASD / Arrows</span> = drive &nbsp;|&nbsp;
    <span class="hl">Space</span> = drift &nbsp;|&nbsp;
    <span class="hl">M</span> = music &nbsp;|&nbsp;
    <span class="hl">R</span> = restart &nbsp;|&nbsp;
    <span class="hl">Esc</span> = menu
  </div>
  <div class="audio-bar">
    <button id="muteBtn" title="Mute all audio">🔊</button>
    <input type="range" id="volSlider" min="0" max="100" value="70">
    <span id="volPct">70%</span>
    <button id="sfxBtn" title="Toggle car sounds" style="color:#888">SFX OFF</button>
  </div>
  <div id="nameOverlay">
    <div id="nameBox">
      <p>Enter your name for the leaderboard</p>
      <input id="nameInput" type="text" maxlength="20" placeholder="Your name" autocomplete="off">
      <div>
        <button class="name-btn" id="nameSubmitBtn">Submit Score</button>
        <button class="name-btn" id="nameSkipBtn">Skip</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    function formatTime(ms) {
      if (ms === Infinity || ms == null) return '--:--.--';
      const tot = Math.floor(ms);
      const m  = Math.floor(tot / 60000);
      const s  = Math.floor((tot % 60000) / 1000);
      const cs = Math.floor((tot % 1000) / 10);
      return m + ':' + String(s).padStart(2,'0') + '.' + String(cs).padStart(2,'0');
    }

    const CIRCUIT = [
      [   0,  380],
      [-280,  380],
      [-460,  250],
      [-520,    0],
      [-460, -250],
      [-280, -390],
      [   0, -440],
      [ 220, -390],
      [ 360, -230],
      [ 210, -110],
      [ 390,   10],
      [ 510,  180],
      [ 400,  330],
      [ 200,  380],
    ];

    const TRACK_W = 132;

    function makeCircuitPath(pts) {
      const n = pts.length;
      const path = new Path2D();
      path.moveTo(pts[0][0], pts[0][1]);
      for (let i = 0; i < n; i++) {
        const p0 = pts[(i - 1 + n) % n];
        const p1 = pts[i];
        const p2 = pts[(i + 1) % n];
        const p3 = pts[(i + 2) % n];
        const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
        const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
        const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
        const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
        path.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2[0], p2[1]);
      }
      path.closePath();
      return path;
    }

    const circuitPath = makeCircuitPath(CIRCUIT);
    const hitCtx = document.createElement('canvas').getContext('2d');
    hitCtx.lineWidth = TRACK_W + 16;
    function isOnTrack(x, y) { return hitCtx.isPointInStroke(circuitPath, x, y); }

    // ── Supabase ───────────────────────────────────────────────────────────
    const db = window.supabase.createClient(
      'https://zbqkjwuummurovwicwsk.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpicWtqd3V1bW11cm92d2ljd3NrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjkyNjgsImV4cCI6MjA5NzEwNTI2OH0.STvtb9moXDdtz98BBVgFPyaBiA-4oyLAkdpx5m9rINo'
    );
    let lbData        = [];
    let lbLoading     = false;
    let lbError       = '';
    let scoreSubmitted = false;
    let playerName    = localStorage.getItem('driftPlayerName') || '';

    async function fetchLeaderboard() {
      lbLoading = true; lbError = '';
      try {
        const { data, error } = await db
          .from('leaderboard')
          .select('name, time_ms, total_time_ms, mode')
          .order('time_ms', { ascending: true })
          .limit(10);
        if (error) throw error;
        lbData = data || [];
      } catch(e) { lbError = 'Error: ' + (e.message || e); console.error('LB fetch error', e); }
      lbLoading = false;
    }

    async function submitScore(name, bestLapMs, totalMs, mode) {
      try {
        await db.from('leaderboard').insert({
          name, time_ms: Math.round(bestLapMs),
          total_time_ms: Math.round(totalMs), mode
        });
      } catch(e) { console.error('Submit failed', e); }
    }

    db.channel('lb_live')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'leaderboard' }, () => {
        if (appState === 'leaderboard') fetchLeaderboard();
      }).subscribe();

    // Name overlay helpers
    const nameOverlay   = document.getElementById('nameOverlay');
    const nameInputEl   = document.getElementById('nameInput');

    function showNamePrompt() {
      if (playerName) { doSubmit(playerName); return; }
      nameInputEl.value = '';
      nameOverlay.style.display = 'flex';
      nameInputEl.focus();
    }
    function hideNamePrompt() { nameOverlay.style.display = 'none'; }

    async function doSubmit(name) {
      if (!name.trim()) return;
      playerName = name.trim().slice(0, 20);
      localStorage.setItem('driftPlayerName', playerName);
      scoreSubmitted = true;
      hideNamePrompt();
      await submitScore(playerName, fastestLap, finishTime, gameMode);
    }

    document.getElementById('nameSubmitBtn').addEventListener('click', () => doSubmit(nameInputEl.value));
    document.getElementById('nameSkipBtn').addEventListener('click', hideNamePrompt);
    nameInputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') doSubmit(nameInputEl.value);
      e.stopPropagation();
    });

    // ── App state ──────────────────────────────────────────────────────────
    // 'menu' | 'online_setup' | 'online_wait' | 'online_join' | 'game' | 'leaderboard'
    let appState = 'menu';
    let gameMode = '1p'; // '1p' | 'cpu' | 'online'
    let menuSel  = 0;
    let menuButtons = [];

    // ── Online state ───────────────────────────────────────────────────────
    let peer             = null;
    let peerConn         = null;
    let lobbyCode        = '';
    let lobbyInputText   = '';
    let onlineSubSel     = 0;
    let onlineSetupBtns  = [];
    let onlinePeerError  = '';
    let onlineCreating   = false;
    let opponentCar      = null;
    let opponentFinished = false;
    let opponentFinishTime = null;

    // ── Player car ─────────────────────────────────────────────────────────
    const car = {
      x: CIRCUIT[0][0], y: CIRCUIT[0][1],
      width: 22, height: 36,
      angle: -Math.PI / 2, velAngle: -Math.PI / 2,
      driftSide: -1, wasDrifting: false,
      speed: 0, vx: 0, vy: 0,
      maxSpeed: 1.8, driftMaxSpeed: 2.25,
      accel: 0.020, brake: 0.07, turnSpeed: 0.044,
    };

    // ── CPU car ────────────────────────────────────────────────────────────
    function makeCPUCar() {
      return {
        x: CIRCUIT[0][0] + 40, y: CIRCUIT[0][1],
        width: 22, height: 36,
        angle: -Math.PI / 2, velAngle: -Math.PI / 2,
        speed: 0, vx: 0, vy: 0,
        maxSpeed: 1.72, accel: 0.019, turnSpeed: 0.040,
        waypointIdx: 1, lapCount: 0,
        prevCarX: CIRCUIT[0][0] + 40, sfCooldown: 300,
      };
    }
    let cpuCar = makeCPUCar();

    const particles = [];
    const skidMarks = [];
    const keys = {};

    // Offscreen canvas for skid marks — one drawImage per frame instead of 1800 strokes
    const SKID_W = 1280, SKID_H = 1024, SKID_OX = 680, SKID_OY = 560;
    const skidCanvas = document.createElement('canvas');
    skidCanvas.width = SKID_W; skidCanvas.height = SKID_H;
    const skidCtx = skidCanvas.getContext('2d');
    skidCtx.lineWidth = 4; skidCtx.lineCap = 'round';

    // ── Race state ─────────────────────────────────────────────────────────
    const TOTAL_LAPS = 3;
    let raceState  = 'countdown';
    let cdTimer    = 0;
    const CD_FRAMES = 4 * 100;
    const STEP = 1000 / 60;
    let lastTime = 0, accumulator = 0;
    let lapCount   = 0;
    let raceStart  = 0;
    let lapStart   = 0;
    let fastestLap = Infinity;
    let lapTimes   = [];
    let prevCarX   = 0;
    let sfCooldown = 0;
    let finishTime = 0;
    let goFlash    = 0;
    let lastCDStage = -1;
    let backfireArmed = false;
    let driftCharge = 0;
    let boostTimer  = 0;
    let boostFlash  = 0;
    let showHowTo   = false;
    let prevEngSpeed  = 0;

    // ── Helpers ────────────────────────────────────────────────────────────
    function angleDiff(a, b) {
      let d = a - b;
      while (d >  Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    function generateLobbyCode() {
      const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      const D = '23456789';
      let c = '';
      for (let i = 0; i < 3; i++) c += L[Math.floor(Math.random() * L.length)];
      for (let i = 0; i < 3; i++) c += D[Math.floor(Math.random() * D.length)];
      return c;
    }

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.lineTo(x + w - r, y);
      c.quadraticCurveTo(x + w, y, x + w, y + r);
      c.lineTo(x + w, y + h - r);
      c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      c.lineTo(x + r, y + h);
      c.quadraticCurveTo(x, y + h, x, y + h - r);
      c.lineTo(x, y + r);
      c.quadraticCurveTo(x, y, x + r, y);
      c.closePath();
    }

    // ── CPU AI ─────────────────────────────────────────────────────────────
    function updateCPU() {
      if (raceState !== 'racing') return;
      if (gameMode !== 'practice' && cpuCar.lapCount >= TOTAL_LAPS) return;

      const target = CIRCUIT[cpuCar.waypointIdx];
      const dx = target[0] - cpuCar.x;
      const dy = target[1] - cpuCar.y;
      if (Math.hypot(dx, dy) < 60)
        cpuCar.waypointIdx = (cpuCar.waypointIdx + 1) % CIRCUIT.length;

      const targetAngle = Math.atan2(dx, -dy);
      const diff = angleDiff(targetAngle, cpuCar.angle);

      cpuCar.speed += cpuCar.accel;
      cpuCar.speed = Math.min(cpuCar.maxSpeed, cpuCar.speed);
      cpuCar.speed *= 0.984;
      if (Math.abs(cpuCar.speed) < 0.005) cpuCar.speed = 0;

      if (Math.abs(cpuCar.speed) > 0.08)
        cpuCar.angle += Math.max(-1, Math.min(1, diff * 3)) * cpuCar.turnSpeed;
      cpuCar.velAngle += angleDiff(cpuCar.angle, cpuCar.velAngle) * 0.30;

      cpuCar.vx = Math.sin(cpuCar.velAngle) * cpuCar.speed;
      cpuCar.vy = -Math.cos(cpuCar.velAngle) * cpuCar.speed;
      cpuCar.x += cpuCar.vx;
      cpuCar.y += cpuCar.vy;

      if (!isOnTrack(cpuCar.x, cpuCar.y)) {
        cpuCar.speed *= 0.94;
        if (cpuCar.speed > 0.65) cpuCar.speed = 0.65;
      }

      if (cpuCar.sfCooldown > 0) cpuCar.sfCooldown--;
      if (cpuCar.prevCarX > 10 && cpuCar.x <= 10 && Math.abs(cpuCar.y - 380) < 55 && cpuCar.sfCooldown === 0) {
        cpuCar.lapCount++;
        cpuCar.sfCooldown = 180;
      }
      cpuCar.prevCarX = cpuCar.x;
    }

    // ── Online helpers ─────────────────────────────────────────────────────
    function createLobby() {
      if (typeof Peer === 'undefined') { onlinePeerError = 'PeerJS failed to load'; return; }
      onlinePeerError = '';
      onlineCreating  = true;
      lobbyCode = generateLobbyCode();
      if (peer) { peer.destroy(); peer = null; }
      peer = new Peer(lobbyCode);
      peer.on('open', () => {
        onlineCreating = false;
        appState = 'online_wait';
      });
      peer.on('error', err => {
        onlineCreating  = false;
        onlinePeerError = String(err.type || err);
      });
      peer.on('connection', c => {
        peerConn = c;
        c.on('open', () => {
          c.send({ type: 'start' });
          startGame('online');
        });
        c.on('data', d => handlePeerData(d));
      });
    }

    function joinLobby(code) {
      if (typeof Peer === 'undefined') { onlinePeerError = 'PeerJS failed to load'; return; }
      onlinePeerError = 'Connecting...';
      if (peer) { peer.destroy(); peer = null; }
      peer = new Peer();
      peer.on('open', () => {
        peerConn = peer.connect(code.trim().toUpperCase());
        peerConn.on('data', d => handlePeerData(d));
        peerConn.on('error', () => { onlinePeerError = 'Connection failed'; });
      });
      peer.on('error', err => { onlinePeerError = String(err.type || err); });
    }

    function handlePeerData(data) {
      if (!data) return;
      if (data.type === 'start') { startGame('online'); return; }
      if (data.type === 'finish') {
        opponentFinished = true;
        opponentFinishTime = data.time;
        return;
      }
      if (!opponentCar) opponentCar = { width: 22, height: 36 };
      opponentCar.x        = data.x;
      opponentCar.y        = data.y;
      opponentCar.angle    = data.angle;
      opponentCar.velAngle = data.velAngle;
      opponentCar.speed    = data.speed;
    }

    function cleanupPeer() {
      if (peerConn) { try { peerConn.close(); } catch(e) {} peerConn = null; }
      if (peer)     { try { peer.destroy();    } catch(e) {} peer     = null; }
    }

    // ── Update ─────────────────────────────────────────────────────────────
    function update() {
      if (appState !== 'game') return;

      if (raceState === 'countdown') {
        cdTimer++;
        const cdStage = Math.floor(cdTimer / 100);
        if (cdStage !== lastCDStage && cdStage <= 3) {
          lastCDStage = cdStage;
          playSFX(cdStage < 3 ? 'countdown' : 'go');
        }
        if (cdTimer >= CD_FRAMES) {
          raceState = 'racing';
          raceStart = performance.now();
          lapStart  = raceStart;
          prevCarX  = car.x;
          goFlash   = 60;
        }
        if (gameMode === 'cpu' || gameMode === 'practice') updateCPU();
        updateSFX(0, 0, true);
        return;
      }
      if (goFlash > 0) goFlash--;

      const fwd   = keys['ArrowUp']    || keys['w'];
      const rev   = keys['ArrowDown']  || keys['s'];
      const lft   = keys['ArrowLeft']  || keys['a'];
      const rgt   = keys['ArrowRight'] || keys['d'];
      const drift = raceState === 'finished' ? false : keys[' '];

      if (fwd) car.speed += car.accel;
      if (rev) car.speed -= car.brake;
      if (drift && car.speed > 0.4) car.speed += 0.007;
      const activeMax = drift ? car.driftMaxSpeed : car.maxSpeed;
      car.speed = Math.max(-0.8, Math.min(activeMax, car.speed));
      car.speed *= 0.984;
      if (Math.abs(car.speed) < 0.005) car.speed = 0;

      if (drift) {
        if (lft) car.driftSide = -1;
        else if (rgt) car.driftSide = 1;
        if (Math.abs(car.speed) > 0.08) {
          const sDir = car.speed >= 0 ? 1 : -1;
          if (lft) car.velAngle -= car.turnSpeed * 1.4 * sDir;
          if (rgt) car.velAngle += car.turnSpeed * 1.4 * sDir;
        }
        const target = car.velAngle + car.driftSide * (Math.PI * 0.30);
        car.angle += angleDiff(target, car.angle) * 0.18;
      } else {
        if (car.wasDrifting) car.velAngle = car.angle;
        if (Math.abs(car.speed) > 0.08) {
          const sDir = car.speed >= 0 ? 1 : -1;
          if (lft) car.angle -= car.turnSpeed * sDir;
          if (rgt) car.angle += car.turnSpeed * sDir;
        }
        car.velAngle += angleDiff(car.angle, car.velAngle) * 0.30;
      }
      if (drift && Math.abs(car.speed) > 0.35) {
        driftCharge = Math.min(1.0, driftCharge + 0.015);
      }
      if (car.wasDrifting && !drift) {
        if (driftCharge > 0.3) {
          boostTimer = driftCharge > 0.75 ? 48 : 24;
          boostFlash = 55;
        }
        driftCharge = 0;
      } else if (!drift) {
        driftCharge = 0;
      }
      car.wasDrifting = drift;

      car.vx = Math.sin(car.velAngle) * car.speed;
      car.vy = -Math.cos(car.velAngle) * car.speed;
      car.x += car.vx;
      car.y += car.vy;

      const onTrackNow = isOnTrack(car.x, car.y);
      if (!onTrackNow) {
        car.speed *= 0.94;
        if (car.speed > 0.65) car.speed = 0.65;
      }

      if (boostTimer > 0) {
        car.speed = Math.min(car.driftMaxSpeed * 1.2, car.speed + 0.030);
        boostTimer--;
      }
      if (boostFlash > 0) boostFlash--;

      if (raceState === 'racing') {
        if (sfCooldown > 0) sfCooldown--;
        if (prevCarX > 10 && car.x <= 10 && Math.abs(car.y - 380) < 55 && sfCooldown === 0) {
          const now = performance.now();
          const lt  = now - lapStart;
          lapTimes.push(lt);
          if (lt < fastestLap) fastestLap = lt;
          lapCount++;
          lapStart   = now;
          sfCooldown = 180;
          playSFX('lap');
          if (lapCount >= TOTAL_LAPS && gameMode !== 'practice') {
            raceState  = 'finished';
            finishTime = now - raceStart;
            playSFX('finish');
            if (gameMode === 'online' && peerConn && peerConn.open)
              peerConn.send({ type: 'finish', time: finishTime });
          }
        }
        prevCarX = car.x;
      }

      const hx = Math.sin(car.angle), hy = -Math.cos(car.angle);
      const pgDot    = car.vx * hx + car.vy * hy;
      const pgLatSpd = Math.hypot(car.vx - pgDot * hx, car.vy - pgDot * hy);
      if (drift && Math.abs(car.speed) > 0.15 && pgLatSpd > 0.1) {
        const rx = car.x - hx * car.height * 0.44;
        const ry = car.y - hy * car.height * 0.44;
        particles.push({
          x: rx + (Math.random() - 0.5) * 18,
          y: ry + (Math.random() - 0.5) * 18,
          life: 1.0, size: 6 + Math.random() * 7,
        });
        const sx = Math.cos(car.angle), sy = Math.sin(car.angle);
        skidMarks.push(
          { x: rx - sx * car.width * 0.38, y: ry - sy * car.width * 0.38, angle: car.velAngle, life: 1.0 },
          { x: rx + sx * car.width * 0.38, y: ry + sy * car.width * 0.38, angle: car.velAngle, life: 1.0 }
        );
        if (skidMarks.length > 400) skidMarks.splice(0, 2);
      }
      for (let i = skidMarks.length - 1; i >= 0; i--) {
        skidMarks[i].life -= 0.04;
        if (skidMarks[i].life <= 0) skidMarks.splice(i, 1);
      }
      // Rebuild skid canvas each frame, batched by alpha bucket (~10 draw calls)
      skidCtx.clearRect(0, 0, SKID_W, SKID_H);
      if (skidMarks.length) {
        const buckets = {};
        for (const m of skidMarks) {
          const k = (Math.round(m.life * 10) / 10).toFixed(1);
          (buckets[k] || (buckets[k] = [])).push(m);
        }
        skidCtx.lineWidth = 4; skidCtx.lineCap = 'round';
        for (const [k, marks] of Object.entries(buckets)) {
          skidCtx.strokeStyle = `rgba(20,15,8,${(+k * 0.5).toFixed(2)})`;
          skidCtx.beginPath();
          for (const m of marks) {
            const dx = Math.sin(m.angle) * 5, dy = -Math.cos(m.angle) * 5;
            skidCtx.moveTo(m.x + SKID_OX - dx, m.y + SKID_OY - dy);
            skidCtx.lineTo(m.x + SKID_OX + dx, m.y + SKID_OY + dy);
          }
          skidCtx.stroke();
        }
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= 0.022; p.size += 0.7;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (gameMode === 'cpu' || gameMode === 'practice') updateCPU();

      if (gameMode === 'online' && peerConn && peerConn.open && raceState !== 'finished')
        peerConn.send({ x: car.x, y: car.y, angle: car.angle, velAngle: car.velAngle, speed: car.speed });

      updateSFX(Math.abs(car.speed), pgLatSpd, onTrackNow);
    }

    // ── Draw: track ────────────────────────────────────────────────────────
    function drawTrack() {
      ctx.fillStyle = '#3d8e49';
      ctx.fillRect(-3000, -3000, 6000, 6000);
      ctx.lineCap  = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#c6c6c6'; ctx.lineWidth = TRACK_W + 16; ctx.stroke(circuitPath);
      ctx.strokeStyle = '#575757'; ctx.lineWidth = TRACK_W;      ctx.stroke(circuitPath);
      ctx.strokeStyle = '#606060'; ctx.lineWidth = TRACK_W - 14; ctx.stroke(circuitPath);
      ctx.strokeStyle = 'rgba(255,210,0,0.72)'; ctx.lineWidth = 2;
      ctx.setLineDash([28, 22]); ctx.stroke(circuitPath); ctx.setLineDash([]);
      const [sx, sy] = CIRCUIT[0];
      const COLS = 4, ROWS = 2, cw = 10, ch = TRACK_W / ROWS;
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? '#fff' : '#111';
          ctx.fillRect(sx - COLS * cw / 2 + c * cw, sy - TRACK_W / 2 + r * ch, cw, ch);
        }
    }

    function drawSkidMarks() {
      ctx.drawImage(skidCanvas, -SKID_OX, -SKID_OY);
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(215,215,215,${(p.life * 0.55).toFixed(2)})`;
        ctx.fill();
      }
    }

    function drawCarShape(cx, cy, cangle, cw, ch, bodyColor) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(cangle);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-cw/2 + 4, -ch/2 + 4, cw, ch);
      ctx.fillStyle = bodyColor;
      ctx.fillRect(-cw/2, -ch/2, cw, ch);
      ctx.fillStyle = 'rgba(155,215,255,0.82)';
      ctx.fillRect(-cw/2 + 3, -ch/2 + 4, cw - 6, 11);
      ctx.fillStyle = 'rgba(155,215,255,0.50)';
      ctx.fillRect(-cw/2 + 3, ch/2 - 13, cw - 6, 9);
      ctx.restore();
    }

    function drawBoostIndicator() {
      if (boostFlash === 0) return;
      const cx = W/2, cy = H/2;

      // BOOST! flash text
      if (boostFlash > 0) {
        const t     = boostFlash / 55;
        const scale = 1 + (1 - t) * 0.4;
        ctx.save();
        ctx.globalAlpha = Math.min(1, t * 2.2);
        ctx.font        = `bold ${Math.round(32 * scale)}px monospace`;
        ctx.fillStyle   = boostFlash > 30 ? '#88ccff' : '#ffcc00';
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.lineWidth   = 3;
        ctx.textAlign   = 'center';
        ctx.strokeText('BOOST!', cx, cy - 58);
        ctx.fillText('BOOST!',   cx, cy - 58);
        ctx.restore();
      }
    }

    function drawCar() {
      drawCarShape(W/2, H/2, car.angle, car.width, car.height, '#e63030');
    }

    function drawSecondCar(c, color) {
      drawCarShape(W/2 + (c.x - car.x), H/2 + (c.y - car.y), c.angle, c.width, c.height, color);
    }

    // ── Draw: HUD ──────────────────────────────────────────────────────────
    function drawHUD() {
      const spd      = Math.abs(car.speed);
      const slip     = Math.abs(angleDiff(car.angle, car.velAngle));
      const drifting = keys[' '] && spd > 0.1 && slip > 0.15 && raceState === 'racing';

      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(8, 8, 200, drifting ? 74 : 54);
      ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '13px Arial';
      ctx.fillText('Speed: ' + (spd * 20).toFixed(0) + ' mph', 16, 28);
      ctx.fillText('WASD/Arrows   Space = drift', 16, 48);
      if (drifting) {
        ctx.fillStyle = '#ff7700'; ctx.font = 'bold 17px Arial';
        ctx.fillText('DRIFT!', 16, 70);
      }

      ctx.textAlign = 'right'; ctx.font = '12px Arial';
      ctx.fillStyle = musicOn ? '#6cf' : '#888';
      ctx.fillText(musicOn ? '♪ MUSIC ON' : '♪ MUSIC OFF', W - 10, 24);

      if (raceState === 'racing' || raceState === 'finished') {
        const now          = raceState === 'racing' ? performance.now() : raceStart + finishTime;
        const curLap       = raceState === 'racing' ? now - lapStart : 0;
        const totalElapsed = raceState === 'racing' ? now - raceStart : finishTime;
        const isPractice   = gameMode === 'practice';
        const displayLap   = isPractice ? lapCount + 1 : Math.min(lapCount + 1, TOTAL_LAPS);
        const lapLabel     = isPractice ? 'LAP ' + displayLap : 'LAP ' + displayLap + ' / ' + TOTAL_LAPS;
        const extraRow     = (gameMode === 'cpu') || (gameMode === 'practice') || (gameMode === 'online' && opponentFinished);

        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(W - 178, 36, 170, extraRow ? 100 : 80);
        ctx.textAlign = 'right'; ctx.fillStyle = isPractice ? '#aaffaa' : '#fff'; ctx.font = 'bold 14px Arial';
        ctx.fillText(lapLabel, W - 12, 56);
        ctx.font = '13px Arial'; ctx.fillStyle = '#ccc';
        ctx.fillText('Cur:  ' + (raceState === 'racing' ? formatTime(curLap) : '--:--.--'), W - 12, 75);
        ctx.fillStyle = fastestLap < Infinity ? '#ffe066' : '#888';
        ctx.fillText('Best: ' + formatTime(fastestLap), W - 12, 93);
        ctx.fillStyle = '#adf';
        ctx.fillText(isPractice ? 'Time: ' + formatTime(totalElapsed) : 'Total: ' + formatTime(totalElapsed), W - 12, 111);
        if (gameMode === 'cpu' || gameMode === 'practice') {
          ctx.fillStyle = '#88aaff'; ctx.font = '12px Arial';
          ctx.fillText('CPU: Lap ' + (cpuCar.lapCount + 1), W - 12, 128);
        }
        if (gameMode === 'online' && opponentFinished && opponentFinishTime != null) {
          ctx.fillStyle = '#88aaff'; ctx.font = '12px Arial';
          ctx.fillText('P2 done: ' + formatTime(opponentFinishTime), W - 12, 128);
        }
      }

      if (raceState === 'countdown' || goFlash > 0) {
        const stage = raceState === 'countdown' ? Math.floor(cdTimer / 100) : 3;
        const label = ['3','2','1','GO!'][stage] || 'GO!';
        const alpha = raceState === 'countdown' ? 1 - (cdTimer % 100) / 100 : goFlash / 60;
        ctx.save();
        ctx.globalAlpha = 0.85 * alpha + 0.15;
        ctx.textAlign = 'center'; ctx.font = 'bold 120px Arial';
        ctx.fillStyle = label === 'GO!' ? '#00ff88' : '#ffffff';
        ctx.shadowColor = label === 'GO!' ? '#00ff88' : '#000';
        ctx.shadowBlur = 30;
        ctx.fillText(label, W/2, H/2 + 40);
        ctx.restore();
      }
    }

    let finishButtons = [];

      ctx.fillRect(W/2 - 220, H/2 - 160, 440, 330);

    // ── Main loop ──────────────────────────────────────────────────────────
    function loop() {
      update();

      if (appState === 'menu') {
        drawMenu();
        if (showHowTo) drawHowToOverlay();
      } else if (appState === 'leaderboard') {
        drawLeaderboard();
      } else if (appState === 'online_setup') {
        drawOnlineSetup();
      } else if (appState === 'online_wait') {
        drawOnlineWait();
      } else if (appState === 'online_join') {
        drawOnlineJoin();
      } else {
        ctx.save();
        ctx.translate(W/2 - car.x, H/2 - car.y);
        drawTrack();
        drawSkidMarks();
        drawParticles();
        ctx.restore();

        if (gameMode === 'cpu' || gameMode === 'practice') drawSecondCar(cpuCar, '#3b7dd8');
        if (gameMode === 'online' && opponentCar) drawSecondCar(opponentCar, '#3b7dd8');
        drawCar();
        drawBoostIndicator();
        drawHUD();
        if (raceState === 'finished') drawFinishScreen();
      }

      requestAnimationFrame(loop);
    }

    // ── Reset / start ──────────────────────────────────────────────────────
    function resetRace() {
      car.x = CIRCUIT[0][0]; car.y = CIRCUIT[0][1];
      car.angle = -Math.PI/2; car.velAngle = -Math.PI/2;
      car.driftSide = -1; car.wasDrifting = false;
      car.speed = 0; car.vx = 0; car.vy = 0;
      particles.length = 0;
      skidMarks.length = 0;
      skidCtx.clearRect(0, 0, SKID_W, SKID_H);
      raceState = 'countdown'; cdTimer = 0;
      lapCount = 0; raceStart = 0; lapStart = 0;
      fastestLap = Infinity; lapTimes = [];
      prevCarX = 0; sfCooldown = 0; finishTime = 0; goFlash = 0;
      lastCDStage = -1; backfireArmed = false; prevEngSpeed = 0;
      driftCharge = 0; boostTimer = 0; boostFlash = 0;
      scoreSubmitted = false;
    }

    function startGame(mode) {
      gameMode = mode;
      appState = 'game';
      resetRace();
      if (mode === 'cpu' || mode === 'practice') cpuCar = makeCPUCar();
      if (mode === 'online') {
        opponentCar = { x: CIRCUIT[0][0], y: CIRCUIT[0][1], angle: -Math.PI/2, width: 22, height: 36 };
        opponentFinished = false; opponentFinishTime = null;
      }
    }

    function selectMenuOption(idx) {
      if (idx === 'help') { showHowTo = true; return; }
      if (idx === 0) startGame('1p');
      else if (idx === 1) startGame('cpu');
      else if (idx === 2) { appState = 'online_setup'; onlineSubSel = 0; onlinePeerError = ''; onlineCreating = false; }
      else if (idx === 3) startGame('practice');
      else if (idx === 4) { appState = 'leaderboard'; fetchLeaderboard(); }
    }

    // ── Music ──────────────────────────────────────────────────────────────
    const bgm = document.getElementById('bgm');
    let musicOn = true, musicStarted = false;
    function startMusic() {
      if (!musicStarted) { bgm.volume = 0.5; bgm.play().catch(() => {}); musicStarted = true; }
      initSFX();
    }

    // ── Sound Effects ──────────────────────────────────────────────────────
    let sfxCtx = null, sfxMaster = null;
    let engOsc1 = null, engOsc2 = null, engFilt = null, engGain = null;
    let turboOsc = null, turboGain = null;
    let squealSrc = null, squealFilt = null, squealGain = null;
    let rumbleSrc = null, rumbleGain = null;
    let sfxReady = false;

    let masterVolume = 0.7;
    let masterMuted  = false;
    let sfxOn        = false;

    function applyMasterVolume() {
      const v = masterMuted ? 0 : masterVolume;
      bgm.volume = v * 0.5;
      bgm.muted  = !musicOn || masterMuted;
      if (sfxMaster) sfxMaster.gain.value = (sfxOn && !masterMuted) ? masterVolume * 0.65 : 0;
    }

    function initSFX() {
      if (sfxReady) return;
      try { sfxCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e) { return; }
      sfxCtx.resume().catch(() => {});
      sfxMaster = sfxCtx.createGain();
      sfxMaster.gain.value = (sfxOn && !masterMuted) ? masterVolume * 0.65 : 0;
      sfxMaster.connect(sfxCtx.destination);

      engOsc1 = sfxCtx.createOscillator(); engOsc1.type = 'sawtooth'; engOsc1.frequency.value = 80;
      engOsc2 = sfxCtx.createOscillator(); engOsc2.type = 'sawtooth'; engOsc2.frequency.value = 84;
      engFilt = sfxCtx.createBiquadFilter(); engFilt.type = 'lowpass'; engFilt.frequency.value = 400; engFilt.Q.value = 3;
      engGain = sfxCtx.createGain(); engGain.gain.value = 0;
      engOsc1.connect(engFilt); engOsc2.connect(engFilt);
      engFilt.connect(engGain); engGain.connect(sfxMaster);
      engOsc1.start(); engOsc2.start();

      turboOsc = sfxCtx.createOscillator(); turboOsc.type = 'sine'; turboOsc.frequency.value = 1200;
      turboGain = sfxCtx.createGain(); turboGain.gain.value = 0;
      turboOsc.connect(turboGain); turboGain.connect(sfxMaster);
      turboOsc.start();

      function loopedNoise(sec) {
        const len = Math.ceil(sfxCtx.sampleRate * sec);
        const buf = sfxCtx.createBuffer(1, len, sfxCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const src = sfxCtx.createBufferSource();
        src.buffer = buf; src.loop = true; return src;
      }

      squealSrc = loopedNoise(2);
      squealFilt = sfxCtx.createBiquadFilter(); squealFilt.type = 'bandpass'; squealFilt.frequency.value = 3500; squealFilt.Q.value = 6;
      squealGain = sfxCtx.createGain(); squealGain.gain.value = 0;
      squealSrc.connect(squealFilt); squealFilt.connect(squealGain); squealGain.connect(sfxMaster);
      squealSrc.start();

      rumbleSrc = loopedNoise(1);
      const rumbleFilt = sfxCtx.createBiquadFilter(); rumbleFilt.type = 'lowpass'; rumbleFilt.frequency.value = 110;
      rumbleGain = sfxCtx.createGain(); rumbleGain.gain.value = 0;
      rumbleSrc.connect(rumbleFilt); rumbleFilt.connect(rumbleGain); rumbleGain.connect(sfxMaster);
      rumbleSrc.start();

      sfxReady = true;
    }

    function sfxNote(freq, delay, dur, vol, wave) {
      if (!sfxReady) return;
      const t = sfxCtx.currentTime;
      const o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
      o.type = wave || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t + delay);
      g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
      o.connect(g); g.connect(sfxMaster);
      o.start(t + delay); o.stop(t + delay + dur + 0.01);
    }

    function sfxPop() {
      if (!sfxReady) return;
      const len = Math.ceil(sfxCtx.sampleRate * 0.05);
      const buf = sfxCtx.createBuffer(1, len, sfxCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = sfxCtx.createBufferSource();
      src.buffer = buf;
      const f = sfxCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 320;
      const g = sfxCtx.createGain(); g.gain.value = 0.6;
      src.connect(f); f.connect(g); g.connect(sfxMaster);
      src.start();
    }

    function playSFX(type) {
      if (!sfxReady) return;
      if (type === 'countdown') sfxNote(880, 0, 0.13, 0.4);
      if (type === 'go')        { sfxNote(1047, 0, 0.38, 0.35); sfxNote(1319, 0, 0.38, 0.28); }
      if (type === 'lap')       [[523,0],[659,0.1],[784,0.2],[1047,0.3]].forEach(([f,dt]) => sfxNote(f, dt, 0.18, 0.22));
      if (type === 'finish')    [[523,0],[659,0.13],[784,0.26],[1047,0.39],[1319,0.55],[1047,0.7],[1319,0.87]].forEach(([f,dt]) => sfxNote(f, dt, 0.16, 0.22));
      if (type === 'backfire') {
        sfxPop();
        if (Math.random() > 0.45) setTimeout(sfxPop, 55 + Math.random() * 70);
        if (Math.random() > 0.65) setTimeout(sfxPop, 140 + Math.random() * 80);
      }
    }

    function updateSFX(spd, driftIntensity, onTrack) {
      if (!sfxReady) return;
      if (sfxCtx.state === 'suspended') sfxCtx.resume().catch(() => {});
      const t = sfxCtx.currentTime, sm = 0.06;
      const eFreq = 80 + spd * 155;
      engOsc1.frequency.setTargetAtTime(eFreq, t, sm);
      engOsc2.frequency.setTargetAtTime(eFreq * 1.05, t, sm);
      engFilt.frequency.setTargetAtTime(500 + spd * 2200, t, sm);
      engGain.gain.setTargetAtTime(appState === 'game' ? 0.18 + spd * 0.14 : 0, t, sm);
      turboOsc.frequency.setTargetAtTime(900 + spd * 900, t, sm);
      turboGain.gain.setTargetAtTime(spd > 0.8 ? (spd - 0.8) * 0.06 : 0, t, sm);
      squealFilt.frequency.setTargetAtTime(2800 + spd * 1200, t, 0.02);
      squealGain.gain.setTargetAtTime(driftIntensity > 0.12 ? Math.min(driftIntensity * 0.35, 0.28) : 0, t, 0.03);
      rumbleGain.gain.setTargetAtTime(!onTrack && spd > 0.2 ? 0.22 : 0, t, 0.08);
      if (spd > 1.3) backfireArmed = true;
      if (backfireArmed && spd < prevEngSpeed - 0.04 && spd < 1.1 && Math.random() < 0.04) {
        playSFX('backfire'); backfireArmed = false;
      }
      prevEngSpeed = spd;
    }

    // ── Input: mouse ───────────────────────────────────────────────────────
    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      if (appState === 'menu')
        menuButtons.forEach(b => { if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) menuSel = b.idx; });
      if (appState === 'online_setup')
        onlineSetupBtns.forEach(b => { if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) onlineSubSel = b.idx; });
    });

    canvas.addEventListener('dblclick', e => {
      if (appState === 'leaderboard') appState = 'menu';
    });

    canvas.addEventListener('click', e => {
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      startMusic();
      if (appState === 'leaderboard') { appState = 'menu'; return; }
      if (appState === 'menu' && showHowTo) { showHowTo = false; return; }
      if (appState === 'menu')
        menuButtons.forEach(b => { if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) selectMenuOption(b.idx); });
      if (appState === 'online_setup')
        onlineSetupBtns.forEach(b => {
          if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) {
            if (b.idx === 0) createLobby();
            else { appState = 'online_join'; lobbyInputText = ''; onlinePeerError = ''; cleanupPeer(); }
          }
        });
      if (appState === 'game' && raceState === 'finished')
        finishButtons.forEach(b => {
          if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) {
            if (b.action === 'submit') showNamePrompt();
            if (b.action === 'leaderboard') { appState = 'leaderboard'; fetchLeaderboard(); }
          }
        });
    });

    // ── Input: keyboard ────────────────────────────────────────────────────
    window.addEventListener('keydown', e => {
      initSFX();
      if (sfxCtx && sfxCtx.state === 'suspended') sfxCtx.resume().catch(() => {});
      if (appState === 'leaderboard') {
        if (e.key === 'Escape') appState = 'menu';
        return;
      }

      if (appState === 'menu' && showHowTo) {
        if (e.key === 'Escape') showHowTo = false;
        return;
      }

      if (appState === 'menu') {
        if (e.key === 'ArrowUp'   || e.key === 'w') menuSel = (menuSel - 1 + 5) % 5;
        if (e.key === 'ArrowDown' || e.key === 's') menuSel = (menuSel + 1) % 5;
        if (e.key === 'Enter' || e.key === ' ') { selectMenuOption(menuSel); startMusic(); }
        e.preventDefault(); return;
      }

      if (appState === 'online_setup') {
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') onlineSubSel = 1 - onlineSubSel;
        if (e.key === 'Enter') {
          if (onlineSubSel === 0) createLobby();
          else { appState = 'online_join'; lobbyInputText = ''; onlinePeerError = ''; cleanupPeer(); }
        }
        if (e.key === 'Escape') appState = 'menu';
        return;
      }

      if (appState === 'online_wait') {
        if (e.key === 'Escape') { cleanupPeer(); appState = 'online_setup'; }
        return;
      }

      if (appState === 'online_join') {
        if (e.key === 'Escape')     { cleanupPeer(); appState = 'online_setup'; lobbyInputText = ''; onlinePeerError = ''; return; }
        if (e.key === 'Backspace')  { lobbyInputText = lobbyInputText.slice(0, -1); return; }
        if (e.key === 'Enter' && lobbyInputText.length === 6) { joinLobby(lobbyInputText); return; }
        if (e.key.length === 1 && /[a-zA-Z0-9]/.test(e.key) && lobbyInputText.length < 6) {
          lobbyInputText += e.key.toUpperCase(); return;
        }
        return;
      }

      // In-game
      keys[e.key] = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
      if (e.key === 'm' || e.key === 'M') { musicOn = !musicOn; bgm.muted = !musicOn || masterMuted; }
      if (e.key === 'r' || e.key === 'R') {
        if (gameMode !== 'online') { resetRace(); if (gameMode === 'cpu') cpuCar = makeCPUCar(); }
      }
      if (e.key === 'Escape') {
        if (gameMode === 'online') cleanupPeer();
        appState = 'menu';
      }
      startMusic();
    });

    window.addEventListener('keyup', e => { keys[e.key] = false; });

    // ── Audio controls ─────────────────────────────────────────────────────
    const muteBtn   = document.getElementById('muteBtn');
    const volSlider = document.getElementById('volSlider');
    const volPct    = document.getElementById('volPct');
    const sfxBtn    = document.getElementById('sfxBtn');

    muteBtn.addEventListener('click', () => {
      initSFX();
      masterMuted = !masterMuted;
      muteBtn.textContent = masterMuted ? '🔇' : '🔊';
      applyMasterVolume();
    });

    sfxBtn.addEventListener('click', () => {
      sfxOn = !sfxOn;
      sfxBtn.textContent = sfxOn ? 'SFX ON' : 'SFX OFF';
      sfxBtn.style.color = sfxOn ? '' : '#888';
      applyMasterVolume();
    });

    volSlider.addEventListener('input', () => {
      initSFX();
      if (sfxCtx && sfxCtx.state === 'suspended') sfxCtx.resume().catch(() => {});
      masterVolume = volSlider.value / 100;
      volPct.textContent = volSlider.value + '%';
      applyMasterVolume();
    });

    loop();
  </script>
</body>
</html>
