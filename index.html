<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drift Game</title>
  <style>
    body {
      margin: 0;
      background: #111;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas {
      border: 3px solid #333;
      box-shadow: 0 0 24px rgba(0,0,0,0.8);
    }
    .info { margin-top: 10px; font-size: 13px; color: #aaa; }
    .hl { color: #6cf; font-weight: bold; }
  </style>
</head>
<body>
  <audio id="bgm" src="eurobeat.mp3" loop></audio>
  <canvas id="gameCanvas" width="800" height="520"></canvas>
  <div class="info">
    <span class="hl">WASD / Arrows</span> = drive &nbsp;|&nbsp;
    <span class="hl">Space</span> = drift &nbsp;|&nbsp;
    <span class="hl">M</span> = music
  </div>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // Circuit centerline waypoints (world coordinates).
    // Circuit is driven counterclockwise starting at point 0, heading left.
    const CIRCUIT = [
      [   0,  380],  // 0: start/finish
      [-280,  380],  // 1: bottom straight
      [-460,  250],  // 2: left hairpin entry
      [-520,    0],  // 3: left hairpin apex
      [-460, -250],  // 4: left hairpin exit
      [-280, -390],  // 5: back straight
      [   0, -440],  // 6: top
      [ 220, -390],  // 7: top-right
      [ 360, -230],  // 8: chicane — right
      [ 210, -110],  // 9: chicane — left
      [ 390,   10],  // 10: sweeper
      [ 510,  180],  // 11: right hairpin apex
      [ 400,  330],  // 12: right hairpin exit
      [ 200,  380],  // 13: bottom-right
    ];

    const TRACK_W = 88;

    // Build a closed Catmull-Rom spline through the waypoints as a Path2D.
    function makeCircuitPath(pts) {
      const n = pts.length;
      const path = new Path2D();
      path.moveTo(pts[0][0], pts[0][1]);
      for (let i = 0; i < n; i++) {
        const p0 = pts[(i - 1 + n) % n];
        const p1 = pts[i];
        const p2 = pts[(i + 1) % n];
        const p3 = pts[(i + 2) % n];
        const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
        const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
        const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
        const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
        path.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2[0], p2[1]);
      }
      path.closePath();
      return path;
    }

    const circuitPath = makeCircuitPath(CIRCUIT);

    const car = {
      x: CIRCUIT[0][0],
      y: CIRCUIT[0][1],
      width: 22, height: 36,
      angle:      -Math.PI / 2,
      velAngle:   -Math.PI / 2,
      driftSide:  -1,    // which side the body is kicked; set on first drift frame
      wasDrifting: false,
      speed: 0,
      vx: 0, vy: 0,          // derived each frame; kept for HUD / smoke
      wasDrifting: false,
      maxSpeed: 1.8,
      accel: 0.020,
      brake: 0.07,
      turnSpeed: 0.044,
    };

    const particles = [];
    const keys = {};

    function angleDiff(a, b) {
      let d = a - b;
      while (d >  Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    function update() {
      const fwd   = keys['ArrowUp']    || keys['w'];
      const rev   = keys['ArrowDown']  || keys['s'];
      const lft   = keys['ArrowLeft']  || keys['a'];
      const rgt   = keys['ArrowRight'] || keys['d'];
      const drift = keys[' '];

      // Speed
      if (fwd) car.speed += car.accel;
      if (rev) car.speed -= car.brake;
      car.speed = Math.max(-0.8, Math.min(car.maxSpeed, car.speed));
      car.speed *= 0.984;
      if (Math.abs(car.speed) < 0.005) car.speed = 0;

      if (drift) {
        // Drift side follows the active steer key so direction changes work naturally.
        if (lft) car.driftSide = -1;
        else if (rgt) car.driftSide =  1;
        // If neither key held, keep the last side so the car stays sideways.

        // Drift steering: steer the VELOCITY direction, not the body.
        if (Math.abs(car.speed) > 0.08) {
          const sDir = car.speed >= 0 ? 1 : -1;
          if (lft) car.velAngle -= car.turnSpeed * 1.4 * sDir;
          if (rgt) car.velAngle += car.turnSpeed * 1.4 * sDir;
        }

        // Smoothly swing the body toward the target sideways angle.
        // Lerping (not snapping) means left→right transitions feel fluid, not jarring.
        const target = car.velAngle + car.driftSide * (Math.PI * 0.30);
        car.angle += angleDiff(target, car.angle) * 0.18;

      } else {
        // Re-grip: snap body instantly to velocity direction, then steer normally.
        if (car.wasDrifting) car.velAngle = car.angle;

        if (Math.abs(car.speed) > 0.08) {
          const sDir = car.speed >= 0 ? 1 : -1;
          if (lft) car.angle -= car.turnSpeed * sDir;
          if (rgt) car.angle += car.turnSpeed * sDir;
        }
        car.velAngle += angleDiff(car.angle, car.velAngle) * 0.30;
      }

      car.wasDrifting = drift;

      // ── Movement in velocity direction ─────────────────────────────────
      car.vx = Math.sin(car.velAngle) * car.speed;
      car.vy = -Math.cos(car.velAngle) * car.speed;
      car.x += car.vx;
      car.y += car.vy;

      // ── Tire smoke ─────────────────────────────────────────────────────
      // Lateral speed relative to body: big when body is sideways to velocity.
      const hx = Math.sin(car.angle), hy = -Math.cos(car.angle);
      const pgDot    = car.vx * hx + car.vy * hy;
      const pgLatSpd = Math.hypot(car.vx - pgDot * hx, car.vy - pgDot * hy);
      if (drift && Math.abs(car.speed) > 0.15 && pgLatSpd > 0.1) {
        const rx = car.x - hx * car.height * 0.44;
        const ry = car.y - hy * car.height * 0.44;
        particles.push({
          x: rx + (Math.random() - 0.5) * 18,
          y: ry + (Math.random() - 0.5) * 18,
          life: 1.0, size: 6 + Math.random() * 7,
        });
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= 0.022;
        p.size += 0.7;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawTrack() {
      // Grass extends to fill screen at any camera position
      ctx.fillStyle = '#3d8e49';
      ctx.fillRect(-3000, -3000, 6000, 6000);

      ctx.lineCap  = 'round';
      ctx.lineJoin = 'round';

      // White curb/edge (widest layer)
      ctx.strokeStyle = '#c6c6c6';
      ctx.lineWidth = TRACK_W + 16;
      ctx.stroke(circuitPath);

      // Asphalt road surface
      ctx.strokeStyle = '#575757';
      ctx.lineWidth = TRACK_W;
      ctx.stroke(circuitPath);

      // Subtle road highlight down the middle
      ctx.strokeStyle = '#606060';
      ctx.lineWidth = TRACK_W - 14;
      ctx.stroke(circuitPath);

      // Dashed yellow centre line
      ctx.strokeStyle = 'rgba(255,210,0,0.72)';
      ctx.lineWidth = 2;
      ctx.setLineDash([28, 22]);
      ctx.stroke(circuitPath);
      ctx.setLineDash([]);

      // Start/finish checkered strip.
      // At point 0 the track runs horizontally, so the checker spans vertically.
      const [sx, sy] = CIRCUIT[0];
      const COLS = 4, ROWS = 2;
      const cw = 10, ch = TRACK_W / ROWS;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#111111';
          ctx.fillRect(sx - COLS * cw / 2 + c * cw, sy - TRACK_W / 2 + r * ch, cw, ch);
        }
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(215,215,215,${(p.life * 0.55).toFixed(2)})`;
        ctx.fill();
      }
    }

    function drawCar() {
      ctx.save();
      ctx.translate(W / 2, H / 2);  // car always at screen centre
      ctx.rotate(car.angle);

      // Drop shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-car.width / 2 + 4, -car.height / 2 + 4, car.width, car.height);

      // Body
      ctx.fillStyle = '#e63030';
      ctx.fillRect(-car.width / 2, -car.height / 2, car.width, car.height);

      // Windshield
      ctx.fillStyle = 'rgba(155,215,255,0.82)';
      ctx.fillRect(-car.width / 2 + 3, -car.height / 2 + 4, car.width - 6, 11);

      // Rear window
      ctx.fillStyle = 'rgba(155,215,255,0.50)';
      ctx.fillRect(-car.width / 2 + 3, car.height / 2 - 13, car.width - 6, 9);

      ctx.restore();
    }

    function drawHUD() {
      const spd      = Math.abs(car.speed);
      const slip     = Math.abs(angleDiff(car.angle, car.velAngle));
      const drifting = keys[' '] && spd > 0.1 && slip > 0.15;

      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(8, 8, 200, drifting ? 74 : 54);
      ctx.textAlign = 'left';
      ctx.fillStyle = '#fff';
      ctx.font = '13px Arial';
      ctx.fillText('Speed: ' + (spd * 20).toFixed(0) + ' mph', 16, 28);
      ctx.fillText('WASD/Arrows   Space = drift', 16, 48);

      if (drifting) {
        ctx.fillStyle = '#ff7700';
        ctx.font = 'bold 17px Arial';
        ctx.fillText('DRIFT!', 16, 70);
      }

      // Music indicator (top-right)
      ctx.textAlign = 'right';
      ctx.font = '12px Arial';
      ctx.fillStyle = typeof musicOn !== 'undefined' && musicOn ? '#6cf' : '#888';
      ctx.fillText(typeof musicOn !== 'undefined' && musicOn ? '♪ MUSIC ON' : '♪ MUSIC OFF', W - 10, 24);
    }

    function loop() {
      update();

      // Translate world so car stays at screen centre
      ctx.save();
      ctx.translate(W / 2 - car.x, H / 2 - car.y);
      drawTrack();
      drawParticles();
      ctx.restore();

      drawCar();
      drawHUD();
      requestAnimationFrame(loop);
    }

    // Music — starts on first keypress (browsers block autoplay before interaction)
    const bgm = document.getElementById('bgm');
    let musicOn = true;
    let musicStarted = false;

    function startMusic() {
      if (!musicStarted) {
        bgm.volume = 0.5;
        bgm.play().catch(() => {});
        musicStarted = true;
      }
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))
        e.preventDefault();
      if (e.key === 'm' || e.key === 'M') {
        musicOn = !musicOn;
        bgm.muted = !musicOn;
      }
      startMusic();
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    loop();
  </script>
</body>
</html>
